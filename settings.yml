# Local-dev settings file -- committed, safe forever, working example.
# CRITERION: only env-var names, placeholder identifiers, relative
# paths, and structure -- never a real, this-deployment-specific value
# (OCID, IP, hostname, literal secret). See CLAUDE.md's Landmines and
# settings.oracle.yml's own header for the same rule applied to the
# production-target file. This is what SETTINGS_FILE defaults to
# (app_settings.py) if unset -- clone this repo, run it, works as-is;
# edit freely for your own paths/values.
#
# Only sections that have actually been migrated exist here (uncommented
# and live) -- see docs/standaloneplan/01-settings-migration.md for what
# has and hasn't moved off raw os.environ yet.

storage:
  # ttl_hours nested inside news_cache_dir, not a sibling storage.*_ttl_*
  # key -- co-locates the retention setting with the directory it prunes,
  # same pattern as news_source.<name>.interval_hours living inside that
  # source's own block. How long an article stays here before
  # cleanup_expired removes it (or moves it to news_archive_dir, if
  # that's configured) -- judged by fetched_at, not the source's own
  # published_dt (see news_cache.py's own comment for why).
  news_cache_dir:
    path: news_cache
    ttl_hours: 48
  # Same nesting, for the same reason. The actual text delivered to a
  # subscriber (distinct from push_outcomes' pass/fail status below).
  message_archive_dir:
    path: message_archive
    ttl_days: 7
  subscribers_db_file: subscribers.db
  # news_archive_dir intentionally omitted -- archiving off, same as the
  # pre-migration default (unset NEWS_ARCHIVE_DIR). default=None in code
  # (news_cache.py), a legitimate state, not a required key. It has no
  # TTL of its own -- articles move here INSTEAD of being deleted, so
  # nothing prunes this directory by age. Stays a bare path (not
  # path:/ttl_hours: nested) since there's nothing to nest.

  # How long the push_outcomes table (delivered/not_relevant/blocked/etc.,
  # used for anomaly detection) keeps its rows -- a storage/retention
  # concern like the two above, not push behavior itself, which is why
  # this lives here rather than under subscription.*/push.*. Longer than
  # the 30-day category-sightings window (categories.
  # sighting_retention_days below): answering "was this normal?" after an
  # incident means comparing against the weeks before it, and these rows
  # are tiny (users_db.py's own comment). TODO.md has a design item to
  # move push_outcomes to a log instead of a DB table -- if that lands,
  # this setting moves or goes away with it.
  push_outcomes_ttl_days: 90

# The AI connector -- generic across any provider speaking the OpenAI
# /chat/completions wire format (agent.build_model_from_config's own
# docstring). To point this deployment at a different provider/model
# (Together.ai, Groq, Fireworks, a self-hosted vLLM server, ...), change
# url/model/api-key below -- no code change, no new dependency. `main` is
# the agent's own model; `guardrail` backs guardrails.py's layer 2 router
# and layer 4 output check (docs/plans/model-portability-plan.md's Level
# 2 per-stage routing) -- both point at the same model below by default,
# since no second provider is configured in this example, but they're
# independently swappable.
#
# reasoning_effort: "none" is a DeepSeek-specific workaround (thinking
# mode rejects the forced tool_choice with_structured_output relies on --
# see agent.build_model_from_config's docstring for the 2026-08-21
# incident this fixes). Omit this key entirely for a provider that
# doesn't need or doesn't accept it.
models:
  main:
    url: https://api.deepseek.com
    model: deepseek-v4-flash
    api-key:
      trailsign-resolve: environment-variable
      name: DEEPSEEK_API_KEY
    reasoning_effort: none
    request_timeout_seconds: 60
  guardrail:
    url: https://api.deepseek.com
    model: deepseek-v4-flash
    api-key:
      trailsign-resolve: environment-variable
      name: DEEPSEEK_API_KEY
    reasoning_effort: none
    # Shorter than main's -- backs a live Telegram user's own message,
    # not a background batch job (agent.build_model_from_config's docstring).
    request_timeout_seconds: 20

# The news-fetching pipeline. ONE news_source: key for the whole file --
# see the newsapi/gnews/perigon comment further down before adding
# anything here; a second top-level `news_source:` mapping would silently
# shadow this entire block (YAML duplicate-key behavior keeps only the
# last one), not merge with it.
#
# tick_seconds/default_interval_hours/request_delay_seconds apply
# globally, regardless of which sources are configured below --
# tick_seconds is bot.py's INGEST_TICK_SECONDS (how often the scheduler
# even checks whether anything's due, not how often a source actually
# gets pulled); default_interval_hours is news_ingest.py's fallback pull
# interval for any source with no per-source interval_hours override
# (see newsapi/perigon below for what an override looks like);
# request_delay_seconds is the delay between consecutive same-source
# requests (GNews's own documented 1 req/sec free-tier limit, applied
# generally since other sources' limits aren't always documented).
news_source:
  tick_seconds: 900
  default_interval_hours: 4
  request_delay_seconds: 1.1

  # RSS news sources -- free, no API key, query-less (each returns its
  # latest N items regardless of what's asked, see news_sources._fetch_rss).
  # Add/remove/edit a feed by editing this list, no code change --
  # news_sources._rss_sources_from_settings reads it. default=[] in code:
  # an empty list here is a legitimate (if sparse) state, not an error.
  # hackernews/arxiv (free, always-on) are NOT here -- wired in directly
  # by news_sources._always_on_sources, see its own docstring for why.
  # newsapi/gnews/perigon (credential-gated) live in news_source.api
  # below instead, one entry per source.
  #
  # THIS SAME LIST MUST BE KEPT IN settings.oracle.yml TOO (byte-identical,
  # no secrets involved either way) -- production reads settings.oracle.yml
  # only, never this file. An edit here alone silently drops production to
  # zero RSS sources on the next deploy, no crash, no error (default=[]
  # fails open by design) -- see docs/standaloneplan/01-settings-migration.md's
  # "Migration methodology" for why this atomicity matters.
  rss:
    # --- AI/ML publications ---------------------------------------------
    - key: openai_blog
      display_name: OpenAI Blog
      url: https://openai.com/news/rss.xml
    - key: huggingface_blog
      display_name: Hugging Face Blog
      url: https://huggingface.co/blog/feed.xml
    - key: techcrunch_ai
      display_name: TechCrunch AI
      url: https://techcrunch.com/category/artificial-intelligence/feed/
    - key: venturebeat_ai
      display_name: VentureBeat AI
      url: https://venturebeat.com/category/ai/feed/
    - key: mit_tech_review
      display_name: MIT Technology Review
      url: https://www.technologyreview.com/feed/

    # --- Mainstream press: Business/Finance sections ---------------------
    - key: bbc_business
      display_name: BBC Business
      url: http://feeds.bbci.co.uk/news/business/rss.xml
    - key: guardian_business
      display_name: The Guardian Business
      url: https://www.theguardian.com/business/rss
    - key: marketwatch
      display_name: MarketWatch
      url: https://feeds.content.dowjones.io/public/rss/mw_topstories
    - key: economist_business
      display_name: The Economist (Business)
      url: https://www.economist.com/business/rss.xml
    - key: nikkei_asia
      display_name: Nikkei Asia
      url: https://asia.nikkei.com/rss/feed/nar

    # --- Mainstream press: Technology sections ----------------------------
    - key: bbc_technology
      display_name: BBC Technology
      url: http://feeds.bbci.co.uk/news/technology/rss.xml
    - key: guardian_technology
      display_name: The Guardian Technology
      url: https://www.theguardian.com/technology/rss
    - key: economist_tech
      display_name: The Economist (Science & Technology)
      url: https://www.economist.com/science-and-technology/rss.xml
    - key: wired_business
      display_name: Wired Business
      url: https://www.wired.com/feed/category/business/latest/rss

    # --- Enterprise/industry IT trade press -------------------------------
    - key: the_register
      display_name: The Register
      url: https://www.theregister.com/headlines.atom
    - key: ars_technica
      display_name: Ars Technica
      url: https://feeds.arstechnica.com/arstechnica/index
    - key: techcrunch
      display_name: TechCrunch
      url: https://techcrunch.com/feed/
    - key: cnbc
      display_name: CNBC
      url: https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=100003114
    - key: computerworld
      display_name: Computerworld
      url: https://www.computerworld.com/index.rss

    # --- Consumer/gadget tech press ----------------------------------------
    - key: zdnet
      display_name: ZDNet
      url: https://www.zdnet.com/rss/all/
    - key: engadget
      display_name: Engadget
      url: https://www.engadget.com/rss.xml
    - key: techradar
      display_name: TechRadar
      url: https://www.techradar.com/rss

  # api -- unlike everything above, these are genuinely OPTIONAL,
  # credential-gated sources: [{key, type, api-key, interval_hours,
  # daily_cap}, ...], one entry per source. `type` selects which
  # news_adapters/*.py class (its own TYPE attribute) handles this entry;
  # `key` is this source's own registry identity, distinct from `type` so
  # two differently-keyed sources could someday share one adapter type
  # (e.g. two NewsAPI accounts under different keys). An entry with an
  # unresolvable api-key (e.g. an unset env var) is silently dropped --
  # that ONE source is skipped, same as an unset env var always did --
  # without taking any OTHER configured entry down with it (see
  # news_sources._raw_api_entries's own docstring for the trailsign
  # finding this design had to account for: resolving the whole list in
  # one call would raise for everything the moment any single entry's
  # credential fails to resolve).
  #
  # Uncomment only the ones you actually have a key for; DO NOT uncomment
  # one with a placeholder/missing env var "just to have it visible" --
  # unlike storage.*/models.* (required=True, must always resolve), a
  # trailsign-resolve node that's PRESENT but points at an unset env var
  # raises SettingsError the moment it's checked, even though the entry
  # is still dropped gracefully once caught. Omitting the entry entirely
  # is the only way to express "I don't have this one".
  #
  # hackernews/arxiv are NOT listed here -- free, no credential, no
  # override, always registered directly by news_sources.py itself (see
  # news_sources._always_on_sources). Only credential-gated sources go
  # in this list; a `type` that has no matching class under news_adapters/
  # fails the whole process at startup (validate_configured_types), so
  # don't add an entry here without a corresponding news_adapters/*.py
  # file already shipped.
  #
  # This stays nested under the SAME news_source: key as tick_seconds/
  # rss above (this indentation is exactly where it'd paste in) -- never
  # add a second top-level `news_source:` mapping, YAML would keep only
  # the last one and silently drop everything above it.
  #
  # interval_hours/daily_cap override news_source.default_interval_hours
  # (above) per source -- e.g. perigon's 8h/3-per-day matches its
  # 150/month budget, newsapi's 24h/1-per-day matches the individual-use
  # judgment recorded in docs/plans/local-news-cache-plan.md. Omit either
  # field on an entry to just use the global default / no cap.
  #
  # newsapi's free tier is documented as development/testing only, not
  # production (docs/current/ai-news-sources.md) -- also restricted from
  # agent.py's live search_news regardless (RESTRICTED_SOURCES), only used
  # by the scheduled ingest job. perigon's budget is small (150/month) and
  # already spoken for by news_ingest.py's own capped pulls -- also
  # RESTRICTED_SOURCES. gnews is the one with real headroom (100/day) and
  # isn't restricted from live search either.
  #
  # api:
  #   - key: newsapi
  #     type: newsapi
  #     api-key:
  #       trailsign-resolve: environment-variable
  #       name: NEWSAPI_API_KEY
  #     interval_hours: 24
  #     daily_cap: 1
  #   - key: gnews
  #     type: gnews
  #     api-key:
  #       trailsign-resolve: environment-variable
  #       name: GNEWS_API_KEY
  #   - key: perigon
  #     type: perigon
  #     api-key:
  #       trailsign-resolve: environment-variable
  #       name: PERIGON_API_KEY
  #     interval_hours: 8
  #     daily_cap: 3

# Push job mechanics (bot.py's tick_seconds, news_push.py's own
# content-selection tuning) -- distinct from subscription.* below, which
# is the subscriber's own cadence preference, not how the push job
# builds/paces a digest.
#
# max_articles_per_topic/max_interests_per_push bound how much one
# subscriber gets in one cycle (see news_push.py's own comments --
# interests that don't fit wait for a later cycle, they aren't dropped).
# relevance_keep/novelty_relevance_keep are the absolute-count
# clamps (fraction of pool, floor, ceiling) news_push.py's relevance
# filter uses instead of a fixed fraction -- see news_push.py's own long
# comment for the three measurements that forced this shape (a fixed
# fraction breaks across pool sizes and topic phrasings, and recall past
# a point stops being worth chasing). near_duplicate_similarity is the
# cosine-similarity threshold two articles collapse at (same wire story
# under two links, or syndication). max_article_age_hours is a ceiling
# on an article's own publish date regardless of when we fetched it
# (deliberately generous -- excludes absurdly stale content, not meant
# to enforce freshness). max_html_attempts is the retry budget before
# giving up on valid Telegram HTML from the model. unreachable_strikes
# is consecutive undeliverable digests before push turns off for that
# subscriber.
push:
  tick_seconds: 900
  max_articles_per_topic: 5
  max_interests_per_push: 5
  max_html_attempts: 3
  near_duplicate_similarity: 0.95
  max_article_age_hours: 168
  unreachable_strikes: 3
  relevance_keep:
    fraction: 0.10
    min: 20
    max: 50
  novelty_relevance_keep:
    fraction: 0.20
    min: 40
    max: 100

# Per-subscriber account/subscription settings (users_db.py).
# default_interval_hours/min_interval_hours are the subscriber-facing
# push-frequency default and floor -- a subscription-level preference,
# not push mechanics (that's push.* above). pushed_link_retention_hours
# is how long the "already sent this link" dedup memory lasts per
# subscriber (see users_db.py's own comment -- deliberately longer than
# news_cache.py's own cache TTL, since the dedup memory only needs to
# outlast whatever the cache TTL already bounds).
subscription:
  default_interval_hours: 24
  min_interval_hours: 1
  pushed_link_retention_hours: 72
  max_interests: 10

# The category-taxonomy-proposal feature specifically (users_db.py's
# categories/category_sightings tables) -- an isolated feature, kept
# separate from subscription.*/push.* above rather than folded into
# either. proposal_threshold is how many sightings of an out-of-taxonomy
# label inside the retention window before an admin is asked to
# activate/merge/reject it (see users_db.py's own comment: a placeholder,
# not a measured value, revisit once there's a real distribution to read).
categories:
  proposal_threshold: 5
  sighting_retention_days: 30

