# Production-target settings.yml TEMPLATE (Oracle VM) -- committed,
# generic, safe forever, as long as it stays this way. See the rule
# below before adding anything to this file.
#
# CRITERION FOR WHAT MAY LIVE HERE (also in CLAUDE.md's Landmines):
# only env-var names, placeholder/example resource identifiers, relative
# paths, and structure -- never a real, this-deployment-specific value
# (a real OCID, IP, hostname, or literal secret). The moment Phase 2+
# needs THIS project's actual vault/secret/compartment OCIDs, those go
# into a new gitignored file under local-infra/ instead (matching
# local-infra/infrastructure.yaml's existing real-values convention) --
# this file keeps a placeholder version, not the real one.
#
# Bridges to the exact same env vars docker_run.command already sets
# (local-infra/infrastructure.yaml) -- zero behavior change is the
# point of this specific file. This IS load-bearing once deployed: the
# migrated code uses required=True for these keys (see
# docs/standaloneplan/01-settings-migration.md's "Migration
# methodology"), so a settings.yml with these values present is a hard
# prerequisite for the container to start at all, not an optional
# nicety.
#
# To actually deploy: add
#   -e SETTINGS_FILE=/config/settings.yml -v <path-on-vm>/settings.yml:/config/settings.yml:ro
# to docker_run.command, scp this file (or the local-infra/ real-values
# version, once one exists) to the VM, then verify with
# tools/check_data_persistence.py afterward -- don't just trust the
# deploy succeeded.

storage:
  # ttl_hours is a sibling of path, not of news_cache_dir's
  # trailsign-resolve node -- a node containing trailsign-resolve
  # collapses entirely to the resolver's return value, so ttl_hours has
  # to sit one level up or it would be silently discarded. Confirmed
  # live, not assumed: Settings({"news_cache_dir": {"trailsign-resolve":
  # ..., "ttl_hours": 48}}).resolved("news_cache_dir") returns a bare
  # string, not a dict -- ttl_hours vanishes. See settings.yml's own
  # comment for why this is nested at all (co-locates the retention
  # setting with the directory it prunes).
  news_cache_dir:
    path:
      trailsign-resolve: environment-variable
      name: NEWS_CACHE_DIR
    ttl_hours: 48
  news_archive_dir:
    trailsign-resolve: environment-variable
    name: NEWS_ARCHIVE_DIR
  message_archive_dir:
    path:
      trailsign-resolve: environment-variable
      name: MESSAGE_ARCHIVE_DIR
    ttl_days: 7
  subscribers_db_file:
    trailsign-resolve: environment-variable
    name: SUBSCRIBERS_DB_FILE
  # A plain tuning value, not a path -- same everywhere, no env-var
  # bridge needed. See settings.yml's own comment for the reasoning.
  push_outcomes_ttl_days: 90

# Bridges to the same DEEPSEEK_API_KEY env var docker-entrypoint.sh
# already vault-fetches (via DEEPSEEK_API_KEY_SECRET_OCID) -- see
# docs/standaloneplan/01-settings-migration.md's "Models" section, this
# is that phase's worked example. Zero behavior change is the point: the
# entrypoint's vault-fetch mechanism doesn't change, only how the running
# process reads the resulting env var (Settings instead of implicitly via
# ChatDeepSeek). See settings.yml's models section for what each key means.
models:
  main:
    url: https://api.deepseek.com
    model: deepseek-v4-flash
    api-key:
      trailsign-resolve: environment-variable
      name: DEEPSEEK_API_KEY
    reasoning_effort: none
    request_timeout_seconds: 60
  guardrail:
    url: https://api.deepseek.com
    model: deepseek-v4-flash
    api-key:
      trailsign-resolve: environment-variable
      name: DEEPSEEK_API_KEY
    reasoning_effort: none
    request_timeout_seconds: 20

# The news-fetching pipeline. ONE news_source: key for the whole file --
# a second top-level `news_source:` mapping is a real bug this file had
# 2026-09-02 to 2026-09-03: YAML duplicate-key handling silently kept
# only the LAST one, which meant production would have deployed with
# ZERO RSS sources (the newsapi/gnews/perigon block below shadowed the
# entire rss list above it) -- caught before it ever reached a real
# deploy, but confirmed live via `yaml.safe_load` showing only
# {newsapi, gnews, perigon} as keys, `rss` silently gone. Don't
# reintroduce this -- everything below is one single mapping.
#
# tick_seconds/default_interval_hours/request_delay_seconds apply
# globally, regardless of which sources are configured below -- see
# settings.yml's own comment on these three for what each one does.
# Bridges to the same NEWSAPI_API_KEY/GNEWS_API_KEY/PERIGON_API_KEY env
# vars docker-entrypoint.sh already vault-fetches (via
# NEWSAPI_API_KEY_SECRET_OCID etc.) -- same worked-example pattern as
# models.*'s DEEPSEEK_API_KEY. All three genuinely optional -- an entry
# whose api-key can't resolve is dropped, not a crash (see
# news_sources._raw_api_entries/_resolved_api_key) -- but production has
# real keys for all three, so all three are live in news_source.api below
# (with their interval_hours/daily_cap overrides), unlike settings.yml's
# commented preview. `type` selects the news_adapters/*.py class that
# handles each entry -- see news_sources.py's module docstring.
#
# RSS list byte-identical to settings.yml's news_source.rss -- MUST be
# kept in sync with it; this is the file production actually reads
# (SETTINGS_FILE=/app/settings.oracle.yml), so an edit only on the
# settings.yml side silently drops production to zero RSS sources on the
# next deploy (default=[] fails open, no crash -- see
# docs/standaloneplan/01-settings-migration.md's "Migration methodology").
news_source:
  tick_seconds: 900
  default_interval_hours: 4
  request_delay_seconds: 1.1

  api:
    - key: newsapi
      type: newsapi
      api-key:
        trailsign-resolve: environment-variable
        name: NEWSAPI_API_KEY
      interval_hours: 24
      daily_cap: 1
    - key: gnews
      type: gnews
      api-key:
        trailsign-resolve: environment-variable
        name: GNEWS_API_KEY
    - key: perigon
      type: perigon
      api-key:
        trailsign-resolve: environment-variable
        name: PERIGON_API_KEY
      interval_hours: 8
      daily_cap: 3

  rss:
    - key: openai_blog
      display_name: OpenAI Blog
      url: https://openai.com/news/rss.xml
    - key: huggingface_blog
      display_name: Hugging Face Blog
      url: https://huggingface.co/blog/feed.xml
    - key: techcrunch_ai
      display_name: TechCrunch AI
      url: https://techcrunch.com/category/artificial-intelligence/feed/
    - key: venturebeat_ai
      display_name: VentureBeat AI
      url: https://venturebeat.com/category/ai/feed/
    - key: mit_tech_review
      display_name: MIT Technology Review
      url: https://www.technologyreview.com/feed/
    - key: bbc_business
      display_name: BBC Business
      url: http://feeds.bbci.co.uk/news/business/rss.xml
    - key: guardian_business
      display_name: The Guardian Business
      url: https://www.theguardian.com/business/rss
    - key: marketwatch
      display_name: MarketWatch
      url: https://feeds.content.dowjones.io/public/rss/mw_topstories
    - key: economist_business
      display_name: The Economist (Business)
      url: https://www.economist.com/business/rss.xml
    - key: nikkei_asia
      display_name: Nikkei Asia
      url: https://asia.nikkei.com/rss/feed/nar
    - key: bbc_technology
      display_name: BBC Technology
      url: http://feeds.bbci.co.uk/news/technology/rss.xml
    - key: guardian_technology
      display_name: The Guardian Technology
      url: https://www.theguardian.com/technology/rss
    - key: economist_tech
      display_name: The Economist (Science & Technology)
      url: https://www.economist.com/science-and-technology/rss.xml
    - key: wired_business
