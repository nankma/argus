[pytest]
pythonpath = .

# Collect only from tests/. Without this, pytest walks the whole repo and
# picks up anything named test_*.py wherever it lives -- which is how three
# analysis scripts under docs/analysis/tools/ ended up being imported as
# test modules and broke CI. They imported fine on a dev machine that had
# numpy/sklearn installed from exploratory work, and failed at collection on
# CI, whose environment comes from environment.yml and deliberately has
# neither (the bot doesn't need them). Local pytest was green for the wrong
# reason.
#
# The scripts are renamed measure_*.py now, but pinning the path is the part
# that stops it recurring: this repo keeps runnable scripts under tools/ and
# docs/analysis/tools/, and one of them will eventually be named test-
# something again.
testpaths = tests
